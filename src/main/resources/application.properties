spring.application.name=ProductService
fakestore-api-url=https://fakestoreapi.com/products/
server.port=8080
#logging.level.org.springframework.web.*=TRACE
#create database productService;
#show databases;
#create user productServiceUser;
#grant all privileges on productService.* to productServiceUser;
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/productService
spring.datasource.username=productServiceUser
#spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9080
#Redis configuration
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
#Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
